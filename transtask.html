<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card img{
            width: 300px;
            height: 400px;
            transition: transform 0.5s ease;
        }
        .card{
            
            width: 300px;
            border-radius: 10px;
            overflow: hidden;
            
        }
        .card:hover img{
            transform: scale(1.2);
        }
        .container{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="card">
        <img src="/ImagesForFrontEnd/SouthIndianbreakfast.png" alt="breakfast">
    </div>
