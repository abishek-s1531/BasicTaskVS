<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .glow-btn{
    padding: 12px 30px;
    border: none;
    background: #0066ff;
    color: white;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s ease;
}

.glow-btn:hover{
    box-shadow:
        0 0 10px #0066ff,
        0 0 20px #0066ff,
        0 0 40px #0066ff,
        0 0 80px #0066ff;
}
    </style>
</head>

<body>
    <button class="glow-btn">Buy Now</button>
</body>
</html>
